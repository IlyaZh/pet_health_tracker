# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      # Указываем решение явно, чтобы восстановить пакеты для всех проектов сразу
      run: dotnet restore "Archie Health Tracker.sln"

    - name: Build
      # Собираем все проекты, входящие в решение
      run: dotnet build "Archie Health Tracker.sln" --no-restore --configuration Release

    - name: Test
      # Запускаем все тесты в решении
      run: dotnet test "Archie Health Tracker.sln" --no-build --verbosity normal


