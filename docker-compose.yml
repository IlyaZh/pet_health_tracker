services:
  archi_health_tracker:
    container_name: archie_app
    image: archie_health_tracker:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__Database=Server=db;Database=${MYSQL_DATABASE};Uid=${MYSQL_USER};Pwd=${MYSQL_PASSWORD};CharSet=utf8mb4;
    ports:
      - "8080:8080"
    volumes:
      - ./src/ArchieHealthTracker.WebService/appsettings.json:/app/appsettings.json:ro
      - ./Logs:/app/Logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: archie_mysql
    restart: always
    command: [ "mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci" ]
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
